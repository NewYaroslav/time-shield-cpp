name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
      - name: Inject version into documentation sources
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -nE 's/^project\(TimeShield VERSION ([^ ]+) .*/\1/p' CMakeLists.txt)
          fi
          test -n "$VERSION" || { echo "Unable to determine project version"; exit 1; }
          echo "Using version: $VERSION"
          TAG="$VERSION"
          test -f docs/mainpage.md || { echo "mainpage.md not found!"; exit 1; }
          sed -i -E "s/^(\\*\\*Version:\*\\* ).*/\\1\\`$TAG\\`/" docs/mainpage.md
          sed -i -E "s/^PROJECT_NUMBER[[:space:]]*=.*/PROJECT_NUMBER         = $VERSION/" Doxyfile
      - name: Generate Documentation
        uses: mattnotmitt/doxygen-action@edge
      - name: Publish generated content to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: docs/html
          publish_branch: gh-pages
