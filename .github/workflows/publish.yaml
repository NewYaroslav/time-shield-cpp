name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
      - name: Inject version into documentation sources
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || sed -n 's/^project(TimeShield VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test -n "$TAG" || { echo "Unable to determine project version"; exit 1; }
          TAG=$(echo "$TAG" | sed 's/^v//')
          echo "Using version: $TAG"
          test -f docs/mainpage.md || { echo "mainpage.md not found!"; exit 1; }
          sed -i -E "s/^(\\*\\*Version:\*\\* ).*/\\1\\`$TAG\\`/" docs/mainpage.md
          sed -i -E "s/^PROJECT_NUMBER[[:space:]]*=.*/PROJECT_NUMBER         = $TAG/" Doxyfile
      - name: Generate Documentation
        uses: mattnotmitt/doxygen-action@edge
      - name: Publish generated content to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: docs/html
          publish_branch: gh-pages
